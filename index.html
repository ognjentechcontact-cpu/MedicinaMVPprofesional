<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIS - Hospital Information System (MVP)</title>
    <style>
        /* Dark Tech & Stealth Estetika */
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --accent-success: #2ea44f;
            --accent-warn: #d29922;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .role-selector-zone {
            background-color: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        select, input, textarea {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            margin-top: 5px;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover { opacity: 0.9; }
        button.btn-success { background-color: var(--accent-success); }
        button.btn-warn { background-color: var(--accent-warn); color: #000; }

        .grid-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2, h3 { margin-bottom: 15px; color: #fff; }
        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; color: var(--text-muted); display: block; }

        /* Lista pacijenata / Red čekanja */
        .patient-list-item {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            background-color: rgba(255,255,255,0.02);
            transition: background 0.2s;
        }
        .patient-list-item:hover { background-color: rgba(255,255,255,0.05); }
        .patient-list-item.active { border-color: var(--accent-color); background-color: rgba(88,166,255,0.1); }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 5px;
        }
        .badge-waiting { background-color: var(--accent-warn); color: #000; }
        .badge-doc { background-color: var(--accent-color); color: #fff; }
        .badge-cons { background-color: #bc8cff; color: #000; }
        .badge-done { background-color: var(--accent-success); color: #fff; }

        /* Sakrivanje sekcija u zavisnosti od uloge */
        .role-section { display: none; }
        .role-section.active-section { display: block; }

        /* Stilovi za Autocomplete MKB-10 */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
        }
        .autocomplete-items div {
            padding: 8px;
            cursor: pointer;
        }
        .autocomplete-items div:hover { background-color: var(--accent-color); color: white; }

        /* Stilovi za štampu (Print-friendly) */
        @media print {
            body { background-color: #fff; color: #000; padding: 0; }
            .no-print { display: none !important; }
            .print-area { display: block !important; border: none !important; background: none !important; padding: 0 !important; width: 100%; }
            .panel { border: none !important; background: none !important; padding: 0 !important; }
